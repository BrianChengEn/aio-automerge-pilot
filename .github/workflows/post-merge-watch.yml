# post-merge-watch: when `ci` fails on main, diagnose, notify the owner in an
# issue, and at most open a revert PR. It never merges and never enables
# auto-merge. Revert PRs it opens are High in risk-gate (auto-revert/* + label).
name: post-merge-watch

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

env:
  OWNER_LOGINS: "BrianChengEn"

jobs:
  diagnose:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write          # push auto-revert/* branch only; main is protected by the ruleset
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Diagnose
        id: dx
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B .github/risk-gate/postmerge.py diagnose
      - name: Ensure labels
        if: steps.dx.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ci-failure --color B60205 --description "main CI failed after merge" 2>/dev/null || true
          gh label create revert --color 5319E7 --description "automatic revert candidate, never auto-merged" 2>/dev/null || true
      - name: Open diagnosis issue
        id: issue
        if: steps.dx.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.dx.outputs.short }}
        run: |
          url=$(gh issue create --title "main CI failed at $SHORT" --label ci-failure --body-file diagnosis.md)
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
      - name: Push revert branch
        id: rv
        if: steps.dx.outputs.revert == 'true'
        env:
          SHA: ${{ steps.dx.outputs.sha }}
          SHORT: ${{ steps.dx.outputs.short }}
        run: |
          git config user.name "post-merge-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "auto-revert/$SHORT"
          if git revert --no-edit "$SHA"; then
            git push origin "auto-revert/$SHORT"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            git revert --abort || true
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open revert PR (never auto-merged)
        if: steps.rv.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.dx.outputs.sha }}
          SHORT: ${{ steps.dx.outputs.short }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: python3 -I -B .github/risk-gate/postmerge.py open-pr "$SHORT" "$SHA" "$ISSUE"
      - name: Note revert conflict
        if: steps.rv.outputs.pushed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: gh issue comment "$ISSUE" --body "git revert did not apply cleanly; no revert PR opened. Needs a fix-forward PR."
